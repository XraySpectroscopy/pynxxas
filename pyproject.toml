[build-system]
requires = [
    "setuptools>=77"
]
build-backend = "setuptools.build_meta"

[project]
name = "pynxxas"
version = "0.0.1.dev0"
authors = [{name = "ESRF", email = "dau-pydev@esrf.fr"}]
description = "Read and write XAS data in NeXus format"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "h5py",
    "pydantic >=2.6",
    "pint >=0.24.4",
    "charset_normalizer",
]

[project.urls]
Homepage = "https://github.com/XraySpectroscopy/pynxxas/"
Documentation = "https://pynxxas.readthedocs.io/"
Repository = "https://github.com/XraySpectroscopy/pynxxas/"
Issues = "https://github.com/XraySpectroscopy/pynxxas/issues"
Changelog = "https://github.com/XraySpectroscopy/pynxxas/-/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest >=7",
]
dev = [
    "pynxxas[test]",
    "ruff",
    "xraylarch",
]
doc = [
    "pynxxas[test]",
    "sphinx >=4.5",
    "sphinx-autodoc-typehints >=1.16",
    "pydata-sphinx-theme < 0.15",
    "xraylarch",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
]
# The formatter sets the line length. Docstrings and strings can be longer.
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.coverage.run]
omit = ['*/tests/*']

[project.scripts]
nxxas-convert = "pynxxas.apps.nxxas_convert:main"
